name = "divia-com"
main = "src/workers/index.ts"
compatibility_date = "2024-10-01"

[vars]
CLOUDFLARE_ACCOUNT_ID = "a582a92c2bdec6ef5bc9cb633febc66e"
JWT_SECRET = "change_this_to_a_secure_random_secret"
NEXT_PUBLIC_APP_NAME = "Divia"

[[d1_databases]]
binding = "DB"
database_name = "divia-prod"
database_id = "replace_with_your_d1_database_id"

[[kv_namespaces]]
binding = "SESSIONS"
id = "replace_with_your_kv_namespace_id"

# Cloudflare Stream credentials should be configured from the Cloudflare dashboard
# or via `wrangler secret put` / environment variables in your deployment.
